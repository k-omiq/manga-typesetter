<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800">
  <defs>
    <!-- Background vertical gradient (#1e1e24 to #161619) -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#161619" />
    </linearGradient>

    <!-- Manga Screentone Halftone Pattern -->
    <pattern id="screentone-dots" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="9" cy="9" r="1.75" fill="#ffffff" />
    </pattern>

    <!-- Top-Right Screentone Fade Mask -->
    <radialGradient id="screentone-mask-tr" cx="100%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="mask-tr">
      <rect width="1320" height="800" fill="url(#screentone-mask-tr)" />
    </mask>

    <!-- Bottom-Left Screentone Fade Mask -->
    <radialGradient id="screentone-mask-bl" cx="0%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="mask-bl">
      <rect width="1320" height="800" fill="url(#screentone-mask-bl)" />
    </mask>

    <!-- Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="560" y1="340" x2="760" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5a5a68" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#808092" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9a9ab0" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1320" height="800" fill="url(#bg-gradient)" />

  <!-- Subtle Inset Border for Native Depth -->
  <rect x="0.5" y="0.5" width="1319" height="799" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Screentone Halftone Textures in Diagonal Corners -->
  <rect width="1320" height="800" fill="url(#screentone-dots)" mask="url(#mask-tr)" />
  <rect width="1320" height="800" fill="url(#screentone-dots)" mask="url(#mask-bl)" />

  <!-- Faint Manga Accent: Dynamic Corner Speedlines (opacity <= 0.08) -->
  <g id="manga-speedlines" opacity="0.05" stroke="#ffffff" stroke-linecap="round">
    <line x1="1320" y1="800" x2="1080" y2="750" stroke-width="1.5" />
    <line x1="1320" y1="800" x2="1130" y2="710" stroke-width="1" />
    <line x1="1320" y1="800" x2="1170" y2="660" stroke-width="2" />
    <line x1="1320" y1="800" x2="1210" y2="610" stroke-width="1.2" />
    <line x1="1320" y1="800" x2="1250" y2="560" stroke-width="1.8" />
    <line x1="1320" y1="800" x2="1285" y2="500" stroke-width="1" />
    <line x1="1320" y1="800" x2="1020" y2="780" stroke-width="1.2" />
  </g>

  <!-- Faint Manga Accent: Minimalist Speech Bubble Silhouette Watermark in Bottom Left -->
  <path d="M 90,680 C 90,635 135,600 200,600 C 265,600 310,635 310,680 C 310,715 280,745 230,755 L 205,780 L 212,756 C 145,754 90,722 90,680 Z"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.03"
        stroke-width="1.5" />

  <!-- Transfer Guide (x=560..760 at y=340) -->
  <g id="transfer-guide">
    <!-- Origin Anchor Dot -->
    <circle cx="560" cy="340" r="3" fill="#5a5a68" fill-opacity="0.6" />

    <!-- Dotted Guide Line -->
    <line x1="568" y1="340" x2="746" y2="340"
          stroke="url(#arrow-grad)"
          stroke-width="2.5"
          stroke-dasharray="6 7"
          stroke-linecap="round" />

    <!-- Directional Arrowhead -->
    <path d="M 746 332 L 760 340 L 746 348"
          fill="none"
          stroke="#9a9ab0"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- App Header & Instructions -->
  <!-- App Title -->
  <text x="660" y="120"
        text-anchor="middle"
        fill="#c8c8d0"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44"
        font-weight="600"
        letter-spacing="5">Manga Typesetter</text>

  <!-- Installation Subtitle -->
  <text x="660" y="168"
        text-anchor="middle"
        fill="#6a6a74"
        font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="400"
        letter-spacing="1">Drag to Applications to install</text>
</svg>
