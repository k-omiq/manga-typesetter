[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The only outbound requests this app makes are `detect::engine` streaming the
# ONNX weights down, and every one of those URLs is https (huggingface.co,
# github.com) — so a TLS backend is unavoidable. rustls rather than native-tls
# keeps the "no OpenSSL, no system crypto library" spirit of
# default-features = false. Nothing else is needed: the download reads raw
# `chunk()`s, so no `json`, and the multipart upload died with the sidecar.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# libproc/rusage bindings for the process-memory report (see src/memory.rs).
# Already in the dep tree via tauri; declared because this crate calls it.
libc = "0.2"
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# CoreML is a macOS-only execution provider; the feature must not reach the
# windows/linux builds or ort fails to compile there.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["coreml"] }
