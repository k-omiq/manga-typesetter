name: CI

# Lightweight gate: frontend build, Rust check/clippy, and a Python import +
# TestClient smoke test. Deliberately skips the heavy ML model downloads and the
# `external/` vendor tree — this proves the three surfaces build/import, not that
# detection runs (that needs the model weights + a real desktop app; see
# docs/REMAINING_WORK.md P1 #1).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build

  rust:
    name: Rust (check + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri's crates link against webkit2gtk/gtk via pkg-config, so even
      # `cargo check` needs the desktop dev libraries on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  python:
    name: Python sidecar (import + TestClient)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base sidecar deps (no ML stack, no external/ vendor tree)
        run: |
          python -m pip install --upgrade pip
          # Base service deps only — the ML stack is heavy and lazily imported.
          # httpx + pytest are the TestClient/runner deps.
          pip install -r requirements.txt httpx pytest
      - name: Import check
        run: python -c "import sidecar.main; print('import sidecar.main OK')"
      - name: Smoke tests (import, /health, token gate)
        run: python -m pytest tests/ -q
